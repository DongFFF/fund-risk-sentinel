# 规则库：程序维度
version: "1.0"
source: builtin
dimension: procedure
tags: [程序, 附件]

rules:

  - id: PRC-001
    name: 缺少发票或票据凭证
    event_types: [reimbursement]
    condition: 'not has_invoice'
    requirement: 支出报销应当附合法有效的发票或票据。
    risk_category: missing
    level_hint: high
    disposition_hint: supplement
    suggestion: 补充发票原件影像或票据查验结果；无法提供的，不得报销。
    weight: 1.5
    basis:
      - doc_title: 中华人民共和国会计法
        article: 第十四条
        text: 办理经济业务事项必须填制或者取得原始凭证，并及时送交会计机构。
      - doc_title: 财政部关于进一步加强科学事业单位内部控制建设的指导意见
        article: 支出控制
        text: 单位应当对支出报销的原始凭证进行审核，确保凭证真实、合法、完整。

  - id: PRC-002
    name: 缺少合同或合同编号
    event_types: [reimbursement, procurement, transfer]
    condition: 'amount >= 10000 and not has_contract'
    requirement: 达到一定金额的采购或服务事项应当签订合同并留存合同文本。
    risk_category: missing
    level_hint: medium
    disposition_hint: supplement
    suggestion: 补充合同文本或说明无需签订合同的制度依据。
    weight: 1.3
    basis:
      - doc_title: 财政部关于进一步加强科学事业单位内部控制建设的指导意见
        article: 合同管理
        text: 单位应当加强合同管理，明确合同订立、履行、变更和终止的控制要求。

  - id: PRC-003
    name: 缺少验收环节材料
    event_types: [reimbursement, settlement]
    condition: 'amount >= 50000 and not has_acceptance'
    requirement: 达到一定金额的采购或服务事项应当履行验收程序并留存验收材料。
    risk_category: missing
    level_hint: medium
    disposition_hint: supplement
    suggestion: 补充验收单或成果交付确认材料。
    weight: 1.2
    basis:
      - doc_title: 财政部关于进一步加强科学事业单位内部控制建设的指导意见
        article: 验收管理
        text: 单位应当建立验收制度，对采购物资、服务及研究成果进行验收并形成书面记录。

  - id: PRC-004
    name: 缺少审批意见或签批记录
    event_types: [reimbursement, advance, transfer, settlement]
    condition: 'not has_approval'
    requirement: 经费支出应当履行规定的审批程序并留存审批记录。
    risk_category: override
    level_hint: high
    disposition_hint: return
    suggestion: 补充审批记录；审批程序未完成的，不得办理支付。
    weight: 1.6
    basis:
      - doc_title: 中华人民共和国会计法
        article: 第二十七条
        text: 各单位应当建立、健全本单位内部会计监督制度，重大对外投资、资产处置等事项应当履行审批程序。
      - doc_title: 财政部关于进一步加强科学事业单位内部控制建设的指导意见
        article: 分级授权
        text: 单位应当建立健全授权审批控制，明确各岗位办理业务和事项的权限范围、审批程序和相应责任。

  - id: PRC-005
    name: 审批程序倒置（先办理后审批）
    event_types: [reimbursement]
    condition: 'contains_any(text, "先报销后审批", "先支后批", "事后补批", "先办理后补签")'
    requirement: 经费支出应当先履行审批程序再办理支付，不得事后补批。
    risk_category: override
    level_hint: high
    disposition_hint: consult
    suggestion: 核实实际办理时序，说明事后补批的原因；程序倒置的应追究相应责任。
    weight: 1.8
    basis:
      - doc_title: 财政部关于进一步加强科学事业单位内部控制建设的指导意见
        article: 不相容岗位分离
        text: 单位应当合理设置岗位，明确职责权限，确保不相容岗位相互分离、相互制约。

  - id: PRC-006
    name: 缺少验收或交付材料（一般金额）
    event_types: [reimbursement]
    condition: 'amount > 0 and amount < 50000 and not has_acceptance and contains_any(purpose, "设备", "材料", "软件", "服务", "加工", "测试")'
    requirement: 采购物资或服务后应当有验收或交付确认环节。
    risk_category: missing
    level_hint: low
    disposition_hint: supplement
    suggestion: 补充验收或交付确认材料；小额支出可简化手续但应留痕。
    weight: 0.7
    basis:
      - doc_title: 财政部关于进一步加强科学事业单位内部控制建设的指导意见
        article: 验收管理
        text: 单位应当根据业务性质和管理需要，合理确定验收的方式和程序。
